<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraphRAG - Knowledge Graph Chat</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
body {font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;display:flex}
.sidebar {width:300px;background:#1e293b;padding:20px;overflow-y:auto;border-right:1px solid #334155}
.main {flex:1;display:flex;flex-direction:column}
.header {padding:16px 24px;background:#1e293b;border-bottom:1px solid #334155}
.header h1 {font-size:20px;color:#38bdf8}
.chat {flex:1;overflow-y:auto;padding:24px}
.input-area {padding:16px 24px;background:#1e293b;border-top:1px solid #334155;display:flex;gap:12px}
.input-area input {flex:1;padding:12px 16px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:15px}
.input-area button {padding:12px 24px;border-radius:8px;border:none;background:#38bdf8;color:#0f172a;font-weight:600;cursor:pointer;font-size:15px}
.input-area button:hover {background:#7dd3fc}
.msg {margin-bottom:16px;padding:12px 16px;border-radius:8px;line-height:1.6}
.msg.user {background:#1e3a5f;margin-left:40px}
.msg.assistant {background:#1e293b;margin-right:40px;border:1px solid #334155}
.entity {display:inline-block;background:#0f766e;color:#ccfbf1;padding:2px 8px;border-radius:4px;margin:2px;font-size:13px}
.stat {padding:12px;margin-bottom:8px;background:#0f172a;border-radius:8px}
.stat .num {font-size:24px;font-weight:700;color:#38bdf8}
.stat .label {font-size:12px;color:#94a3b8}
.loading {color:#94a3b8;font-style:italic}
</style>
</head>
<body>
<div class="sidebar">
  <h2 style="margin-bottom:16px;color:#38bdf8">GraphRAG</h2>
  <div class="stat"><div class="num" id="nodeCount">-</div><div class="label">Entities</div></div>
  <div class="stat"><div class="num" id="relCount">-</div><div class="label">Relationships</div></div>
  <div class="stat"><div class="num" id="commCount">-</div><div class="label">Communities</div></div>
  <button onclick="refreshStats()" style="margin-top:12px;width:100%;padding:8px;border-radius:6px;border:1px solid #475569;background:transparent;color:#94a3b8;cursor:pointer">Refresh</button>
</div>
<div class="main">
  <div class="header"><h1>GraphRAG Knowledge Graph Chat</h1></div>
  <div class="chat" id="chat"></div>
  <div class="input-area">
    <input id="query" placeholder="Ask about the knowledge graph..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
  </div>
</div>
<script>
const API = "http://localhost:8000";
async function refreshStats() {
  try {
    const r = await fetch(API + "/graph/summary");
    const d = await r.json();
    document.getElementById("nodeCount").textContent = d.nodes;
    document.getElementById("relCount").textContent = d.relationships;
  } catch(e) {console.error(e)}
  try {
    const r = await fetch(API + "/communities");
    const d = await r.json();
    document.getElementById("commCount").textContent = d.communities.length;
  } catch(e) {}
}
async function send() {
  const q = document.getElementById("query").value.trim();
  if(!q) return;
  const chat = document.getElementById("chat");
  chat.innerHTML += '<div class="msg user">' + q + '</div>';
  chat.innerHTML += '<div class="msg assistant loading">Thinking...</div>';
  document.getElementById("query").value = "";
  chat.scrollTop = chat.scrollHeight;
  try {
    const r = await fetch(API + "/answer", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({query:q})
    });
    const d = await r.json();
    const last = chat.querySelector(".loading");
    if(last) last.outerHTML = '<div class="msg assistant">' + d.answer + '</div>';
    if(d.entities) {
      const el = chat.lastElementChild;
      el.innerHTML += "<div style='margin-top:8px'>" +
        d.entities.map(e=>'<span class="entity">'+e.name+'</span>').join("") +
        "</div>";
    }
  } catch(e) {
    const last = chat.querySelector(".loading");
    if(last) last.outerHTML = '<div class="msg assistant">Error: ' + e.message + '</div>';
  }
  chat.scrollTop = chat.scrollHeight;
}
refreshStats();
</script>
</body>
</html>

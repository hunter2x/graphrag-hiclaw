[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-hiclaw"
version = "0.1.0"
description = "GraphRAG: Knowledge Graph RAG System"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.14.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.50.0",
    "chromadb>=0.5.0",
    "networkx>=3.3",
    "pydantic>=2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "graspologic>=3.4.0"]

[project.scripts]
graphrag = "src.graphrag.__main__:main"
